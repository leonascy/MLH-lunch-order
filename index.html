<style>
/* Layout: canteen tray — sticky header with week tabs + who's picking, then one "tray row" per school day of five dish cards. */
:root {
  --bg: #f3f6f1;
  --surface: #ffffff;
  --ink: #1d2b26;
  --muted: #5d6e66;
  --line: #d9e2dc;
  --accent: #e2602d;
  --accent-ink: #ffffff;
  --accent-soft: #fde6dc;
  --green: #2f7d5b;
  --green-soft: #dff0e6;
  --warn: #a5650a;
  --warn-soft: #fbedd0;
  --chip: #eef2ef;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121916; --surface: #1b2420; --ink: #e8efe9; --muted: #9db0a6; --line: #2d3a34;
  --accent: #f07a48; --accent-ink: #1a0f0a; --accent-soft: #3d2419; --green: #6cc49a; --green-soft: #1d3329;
  --warn: #e9b05a; --warn-soft: #3a2c14; --chip: #24302b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121916; --surface: #1b2420; --ink: #e8efe9; --muted: #9db0a6; --line: #2d3a34;
  --accent: #f07a48; --accent-ink: #1a0f0a; --accent-soft: #3d2419; --green: #6cc49a; --green-soft: #1d3329;
  --warn: #e9b05a; --warn-soft: #3a2c14; --chip: #24302b; color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 10px; }
.wrap { max-width: 1180px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
.sync { font-size: 0.78rem; color: var(--muted); }

.who { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.who button { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px 6px 6px; display: flex; align-items: center; gap: 8px; font-weight: 800; }
.who button .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); font-family: var(--display); font-size: 0.9rem; }
.who button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.who button[aria-pressed="true"] .av { background: var(--accent); color: var(--accent-ink); }
.who .parent { margin-left: auto; padding: 6px 14px; }

.weeks { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.weeks button { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.weeks button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.weeks button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-left: 6px; vertical-align: middle; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; }
.intro { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.intro h2 { font-family: var(--display); font-weight: 800; font-size: 1.35rem; margin: 0; text-wrap: balance; }
.progress { font-weight: 800; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress b { color: var(--green); }

.legend { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; font-size: 0.78rem; }

.day { margin-bottom: 22px; }
.dayhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.dayhead h3 { font-family: var(--display); font-weight: 800; font-size: 1.1rem; margin: 0; }
.dayhead .date { color: var(--muted); font-size: 0.85rem; }
.dayhead .state { margin-left: auto; font-size: 0.78rem; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.state.todo { background: var(--warn-soft); color: var(--warn); }
.state.done { background: var(--green-soft); color: var(--green); }
.state.locked { background: var(--chip); color: var(--muted); }

.tray { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .tray { grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); } }
.dish { position: relative; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: border-color .15s, transform .15s; }
.dish:hover:not(:disabled) { border-color: var(--accent); }
.dish:active:not(:disabled) { transform: scale(0.98); }
.dish .em { font-size: 1.9rem; line-height: 1; }
.dish .nm { font-weight: 800; font-size: 0.95rem; line-height: 1.25; }
.dish .ds { font-size: 0.8rem; color: var(--muted); }
.dish .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.tag { font-size: 0.7rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--muted); letter-spacing: 0.02em; }
.tag.cat { background: transparent; border: 1px solid var(--line); }
.tag.veg { background: var(--green-soft); color: var(--green); }
.tag.nh { background: var(--warn-soft); color: var(--warn); }
.dish.sel { border-color: var(--accent); background: var(--accent-soft); }
.dish .tick { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; }
.dish:disabled { cursor: default; opacity: 0.55; }
.dish.sel:disabled { opacity: 1; }
.dish.ordered { border-color: var(--green); background: var(--green-soft); opacity: 1; }
.dish.ordered .tick { background: var(--green); }

/* Parent view */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.panel h3 { font-family: var(--display); font-weight: 800; margin: 0 0 10px; font-size: 1.05rem; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 0.88rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 800; }
td.day-c { font-weight: 800; white-space: nowrap; }
td .miss { color: var(--warn); font-weight: 800; }
td .ord { color: var(--green); font-weight: 800; font-size: 0.75rem; display: block; }
td .flag { color: var(--warn); font-size: 0.75rem; display: block; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn { border: 2px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 14px; font-weight: 800; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.good { background: var(--green); border-color: var(--green); color: var(--surface); }
pre.list { white-space: pre-wrap; background: var(--chip); border-radius: 10px; padding: 12px; font-size: 0.85rem; margin: 12px 0 0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 10px; }
.names label { font-size: 0.78rem; font-weight: 800; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.names input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.notes { font-size: 0.85rem; color: var(--muted); margin: 0; padding-left: 18px; max-width: 75ch; }
.notes li { margin-bottom: 4px; }
.banner { background: var(--green-soft); color: var(--green); font-weight: 800; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 0.85rem; z-index: 20; }
.seg { display: inline-flex; background: var(--chip); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 16px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 16px; font-weight: 800; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.sumweek { margin-bottom: 20px; }
.sumweek h3 { font-family: var(--display); font-weight: 800; font-size: 1.05rem; margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.sumweek h3 .progress { font-size: 0.8rem; }
.sumgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 760px) { .sumgrid { grid-template-columns: 1fr; } }
.sumday { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
@media (max-width: 760px) { .sumday { flex-direction: row; align-items: center; gap: 12px; } }
.sumday .when { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); white-space: nowrap; }
.sumday .em { font-size: 1.5rem; line-height: 1; }
.sumday .nm { font-weight: 800; font-size: 0.9rem; line-height: 1.25; }
.sumday .st { font-size: 0.72rem; font-weight: 800; }
.sumday .st.ok { color: var(--green); }
.sumday .st.wait { color: var(--muted); }
.sumday.empty .nm { color: var(--warn); }
.sumday.gone { opacity: 0.5; }
.sumday .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.panel p.help { margin: 0 0 10px; color: var(--muted); font-size: 0.88rem; max-width: 75ch; }
.pinbox { max-width: 340px; margin: 32px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.pinbox .lock { font-size: 2rem; }
.pinbox h2 { font-family: var(--display); font-weight: 800; margin: 0; font-size: 1.3rem; }
.pinbox label { font-weight: 800; font-size: 0.85rem; color: var(--muted); }
.signbox input { font-size: 1rem !important; letter-spacing: 0 !important; text-align: left !important; }
.pinbox input { font: inherit; font-size: 1.6rem; letter-spacing: 0.4em; text-align: center; padding: 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; }
.pinbox p { margin: 0; font-size: 0.82rem; }
.pinhint { color: var(--muted); }
.pinerr { color: var(--warn); font-weight: 800; }
.catrow { display: flex; flex-wrap: wrap; gap: 8px; }
.ctl { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; background: var(--bg); font-weight: 800; font-size: 0.88rem; min-width: 0; }
.ctl input { width: 18px; height: 18px; accent-color: var(--green); flex: 0 0 auto; margin: 0; }
.ctl.off { opacity: 0.55; }
.ctl.off .nm { text-decoration: line-through; }
.ctlweek { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.ctlday .dayhead { margin-bottom: 6px; }
.ctllist { display: flex; flex-direction: column; gap: 6px; }
.dishctl { font-weight: 400; }
.dishctl .em { font-size: 1.3rem; }
.dishctl .txt { display: flex; flex-direction: column; min-width: 0; }
.dishctl .nm { font-weight: 800; font-size: 0.88rem; }
.dishctl .ds { font-size: 0.75rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .dish { transition: none; } }
</style>
</head>

    cats));

  // Dish by dish, this week
  const days = el("div", { class: "ctlweek" });
  w.days.forEach((dishes, di) => {
    const date = addDays(w.start, di);
    const list = el("div", { class: "ctllist" });
    dishes.forEach((raw, ci) => {
      const d = parseDish(raw); const id = "h_" + date + "_" + ci;
      const catOff = !!state.hiddenCats[ci];
      const box = el("input", { type: "checkbox", id, checked: !isHidden(date, ci), disabled: catOff });
      box.addEventListener("change", () => { const k = date + "__" + ci; if (box.checked) delete state.hidden[k]; else state.hidden[k] = true; saveConfig(); render(); });
      list.append(el("label", { class: "ctl dishctl" + (isHidden(date, ci) ? " off" : ""), for: id }, box,
        el("span", { class: "em", "aria-hidden": "true" }, emojiFor(d.name)),
        el("span", { class: "txt" },
          el("span", { class: "nm" }, d.name),
          el("span", { class: "ds" }, CATS[ci] + (d.tags.length ? " · " + d.tags.map(t => TAGNAMES[t] || t).join(", ") : "") + (catOff ? " · whole menu hidden" : "")))));
    });
    days.append(el("section", { class: "ctlday" },
      el("div", { class: "dayhead" }, el("h3", {}, DAYNAMES[di]), el("span", { class: "date" }, fmtDate(date)),
        isPast(date) ? el("span", { class: "state locked" }, "Day passed") : null),
      list));
  });
  view.append(el("div", { class: "panel" },
    el("h3", {}, "Dish by dish"),
    el("p", { class: "help" }, "Untick a dish to hide it from the boys. If one of them already picked it, that pick is cleared and shows as \"Not picked\" in Review. Meals already paid for on GOe stay as they are."),
    days,
    hiddenThisWeek ? el("div", { class: "actions" },
      el("button", { class: "btn ghost", onclick: () => {
        w.days.forEach((_, di) => { const date = addDays(w.start, di); for (let ci = 0; ci < 5; ci++) delete state.hidden[date + "__" + ci]; });
        saveConfig(); render(); toast("All dishes showing for this week");
      } }, "Show every dish this week")) : null));
}

function renderReview() {
  const wi = state.week, w = WEEKS[wi]; const view = $("view"); view.replaceChildren();
  parentTabs(view);
  let missing = 0, flags = 0;
  const thead = el("tr", {}, el("th", {}, "Day"), ...state.names.map((n, i) => el("th", {}, n || "Kid " + (i + 1))));
  const tbody = el("tbody");
  w.days.forEach((dishes, di) => {
    const date = addDays(w.start, di);
    const row = el("tr", {}, el("td", { class: "day-c" }, DAYNAMES[di].slice(0, 3) + " " + fmtDate(date)));
    state.names.forEach((_, kid) => {
      const p = pickFor(kid, date); const oc = orderedCat(kid, date);
      if (p === undefined) {
        const open = !isPast(date) && hasOptions(date);
        if (open) missing++;
        row.append(el("td", {}, !open ? el("span", { class: "ds" }, "—") : el("span", { class: "miss" }, "Not picked")));
      } else {
        const d = parseDish(dishes[p]);
        const ask = d.tags.includes("n"); if (ask) flags++;
        const slot = slotFor(kid, date);
        row.append(el("td", {}, CATS[p] + ": " + d.name,
          slot !== "Lunch" ? el("span", { class: "flag" }, slot) : null,
          oc !== undefined || state.ordered[w.start] ? el("span", { class: "ord" }, "Ordered & paid") : null,
          ask ? el("span", { class: "flag" }, "Check peanuts with GOe") : null));
      }
    });
    tbody.append(row);
  });

  view.append(el("div", { class: "intro" },
    el("h2", {}, "Week of " + weekLabel(w)),
    el("div", { class: "progress" }, missing ? el("span", { class: "miss" }, missing + " picks missing") : el("b", {}, "All picks in"))));

  const listBox = state.showList ? el("pre", { class: "list", id: "orderlist" }, orderListText(wi)) : null;
  view.append(el("div", { class: "panel" },
    el("h3", {}, "Who picked what"),
    el("div", { class: "tablewrap" }, el("table", {}, el("thead", {}, thead), tbody)),
    el("div", { class: "actions" },
      el("button", { class: "btn", onclick: () => { state.showList = !state.showList; render(); } }, state.showList ? "Hide order list" : "Show order list"),
      el("button", { class: "btn ghost", onclick: copyList }, "Copy order list"),
      state.ordered[w.start]
        ? el("button", { class: "btn ghost", onclick: () => { delete state.ordered[w.start]; saveConfig(); render(); toast("Week unlocked"); } }, "Unlock this week")
        : el("button", { class: "btn good", onclick: () => { state.ordered[w.start] = true; saveConfig(); render(); toast("Marked as ordered. Kids' picks are locked."); } }, "Mark week as ordered on GOe")),
    listBox));

  const cp = chromePrompt(wi);
  view.append(el("div", { class: "panel" },
    el("h3", {}, "Add to cart with Claude in Chrome"),
    el("p", { class: "help" }, cp.count
      ? "This prompt covers " + cp.count + " meal" + (cp.count === 1 ? "" : "s") + " that are picked but not yet ordered. Open goe.sg in Chrome, sign in, open the Claude side panel and paste it. Claude fills the cart and stops before payment, so you or your husband can check and pay."
      : "Nothing to add yet. Once the boys pick meals for days that aren't ordered, the prompt appears here."),
    cp.count ? el("div", { class: "actions" },
      el("button", { class: "btn", onclick: copyPrompt }, "Copy prompt"),
      el("button", { class: "btn ghost", onclick: () => { state.showPrompt = !state.showPrompt; render(); } }, state.showPrompt ? "Hide prompt" : "Show prompt")) : null,
    cp.count && state.showPrompt ? el("pre", { class: "list", id: "chromeprompt" }, cp.text) : null,
    cp.count ? el("p", { class: "help", style: "margin-top:12px" }, "After paying on goe.sg, tap \"Mark week as ordered\" above so the boys see their lunches as ordered.") : null));

  const names = el("div", { class: "names" });
  state.names.forEach((n, i) => {
    const inp = el("input", { id: "name" + i, value: n, maxlength: "20" });
    inp.addEventListener("input", () => { state.names[i] = inp.value; renderHeader(); saveConfig(); });
    names.append(el("label", { for: "name" + i }, "Child " + (i + 1), inp));
  });
  view.append(el("div", { class: "panel" }, el("h3", {}, "Children"), names));

  view.append(el("div", { class: "panel" }, el("h3", {}, "Menu notes"),
    el("ul", { class: "notes" },
      el("li", {}, "Allergen tags only reflect listed ingredients. GOe's central kitchen warns of cross-contact."),
      el("li", {}, "No nut tags on the menu. Kung Pao Chicken (23 Oct) and Satay Chicken (10 Nov) often contain peanuts."),
      el("li", {}, "Cereal coatings and pizzas may contain dairy or egg that isn't listed."),
      el("li", {}, "International dishes come from the non-halal menu. All rice is mixed grain; all chicken is boneless."),
      el("li", {}, "This menu ends 20 Nov. Send Claude the next menu to add more weeks."))));
}

async function copyList() {
  const text = orderListText(state.week);
  try { await navigator.clipboard.writeText(text); toast("Order list copied"); }
  catch (e) {
    state.showList = true; render();
    const pre = $("orderlist"); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("Text selected. Copy it from your keyboard menu.");
  }
}

function renderSignIn() {
  const view = $("view"); view.replaceChildren();
  const email = el("input", { id: "email", type: "email", autocomplete: "username", placeholder: "Family email" });
  const pass = el("input", { id: "password", type: "password", autocomplete: "current-password", placeholder: "Password" });
  const msg = el("p", { id: "signmsg", class: "pinhint" }, "Sign in once on this device. It stays signed in.");
  const go = async () => {
    msg.className = "pinhint"; msg.textContent = "Signing in…";
    try { await auth.signInWithEmailAndPassword(email.value.trim(), pass.value); }
    catch (e) { msg.className = "pinerr"; msg.textContent = "That email or password isn't right. Check them and try again."; }
  };
  pass.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
  view.append(el("div", { class: "pinbox signbox", role: "group", "aria-label": "Family sign-in" },
    el("div", { class: "lock", "aria-hidden": "true" }, "🍱"),
    el("h2", {}, "Family sign-in"),
    el("label", { for: "email" }, "Email"), email,
    el("label", { for: "password" }, "Password"), pass,
    msg,
    el("button", { class: "btn", type: "button", onclick: go }, "Sign in")));
}

function render() {
  if (state.auth === "checking") { $("who").replaceChildren(); $("weeks").replaceChildren(); $("view").replaceChildren(el("p", { class: "pinhint", style: "text-align:center;margin-top:40px" }, "Loading…")); return; }
  if (state.auth === "signedout") { $("who").replaceChildren(); $("weeks").replaceChildren(); renderSignIn(); return; }
  if (state.who !== "parent" && !(state.who >= 0 && state.who < 3)) state.who = 0;
  renderHeader();
  if (state.who === "parent") renderParent(); else renderKid(state.who);
}
setSync();
render();
</script>
</body>
</html>
